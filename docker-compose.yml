# ============================================
# Smart Tech Ecommerce - Docker Compose Configuration
# ============================================
#
# ⚠️  CRITICAL WARNING - DATA LOSS PREVENTION ⚠️
#
# NEVER use: docker-compose down -v
# NEVER use: docker compose down -v
# NEVER use: docker-compose down --volumes
#
# The -v flag removes ALL named volumes, including:
#   - postgres_data (ALL database data - products, users, orders, etc.)
#   - redis_data (all cache and session data)
#   - es_node1_data, es_node2_data, es_node3_data (all search indices)
#   - qdrant_data (all vector embeddings)
#   - ollama_data (all AI models)
#
# To stop containers safely: docker-compose down
# To restart containers: docker-compose up -d
#
# ALWAYS create a backup before major changes:
#   docker exec -i smarttech_postgres pg_dump -U smart_dev smart_ecommerce_dev > backup.sql
#
# For backup and restore procedures, see:
#   BACKUP_AND_RECOVERY_GUIDE.md
#   scripts/automated-backup.sh
#   scripts/pre-deployment-backup.sh
# ============================================

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarttech_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    mem_limit: 4g
    memswap_limit: 6g
    mem_reservation: 2g
    environment:
      - NODE_OPTIONS=--max-old-space-size=1536 --max-semi-space-size=128
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_BACKEND_API_URL=http://localhost:3001/api/v1
      - BACKEND_API_URL=http://host.docker.internal:3001/api/v1
      - NODE_ENV=production
      - IS_DOCKER=true
      - NEXT_PRIVATE_SKIP_SWC=1
      # NextAuth Configuration - CRITICAL for session persistence
      # Use the same secret value as defined in docker-compose
      - NEXTAUTH_SECRET=niAUogdInPua71/ckWExw3Wjsj8tyAtf9JltTBfBBfk=
      - NEXTAUTH_URL=http://localhost:3000
      # Ensure NEXTAUTH_SECRET is available at runtime for middleware
      - NEXTAUTH_SECRET_RUNTIME=niAUogdInPua71/ckWExw3Wjsj8tyAtf9JltTBfBBfk=
      - NEXTAUTH_SESSION_MAX_AGE=2592000
      - NEXTAUTH_SESSION_UPDATE_AGE=86400
      - NEXTAUTH_DEBUG=true
      - NEXTAUTH_SECURE_COOKIES=false
    networks:
      - smarttech_network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarttech_backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    mem_limit: 4g
    memswap_limit: 6g
    mem_reservation: 2g
    environment:
      # Environment Detection - Critical for Redis configuration
      - NODE_ENV=production
      - IS_DOCKER=true
      - DOCKER_ENV=true
      - NODE_OPTIONS=--max-old-space-size=2048 --max-semi-space-size=256
      
      # Application Configuration
      - PORT=3000
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=smarttech-super-secret-jwt-key-change-in-production-2024
      - JWT_EXPIRES_IN=7d
      
      # Database Configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=smart_dev
      - DB_PASSWORD=smart_dev_password_2024
      - DB_NAME=smart_ecommerce_dev
      - DATABASE_URL=postgresql://smart_dev:smart_dev_password_2024@postgres:5432/smart_ecommerce_dev
      
      # Redis Configuration (Docker-specific)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_smarttech_2024
      - REDIS_URL=redis://:redis_smarttech_2024@redis:6379
      - REDIS_TTL=3600
      
      # External Services
      - ELASTICSEARCH_URL=http://es-node1:9200
      - OLLAMA_HOST=http://ollama:11434
      
      # Testing Configuration (Disabled in Production)
      - DISABLE_EMAIL_VERIFICATION=false
      - DISABLE_PHONE_VERIFICATION=false
      - TESTING_MODE=false
      
      # Security Configuration
      - BCRYPT_ROUNDS=12
      
      # File Upload Configuration
      - MAX_FILE_SIZE=5242880
      - UPLOAD_PATH=uploads
      # Backend URL for constructing image URLs (must match what frontend uses)
      # Use localhost so browser can access images from host machine
      - BACKEND_URL=http://localhost:3001
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - smarttech_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      es-node1:
        condition: service_healthy

  es-node1:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: smarttech_es_node1
    restart: unless-stopped
    environment:
      - cluster.name=smarttech-cluster
      - node.name=es-node1
      - node.roles=master,data,ingest
      - discovery.seed_hosts=es-node2,es-node3
      - cluster.initial_master_nodes=es-node1,es-node2,es-node3
      - network.host=0.0.0.0
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - bootstrap.memory_lock=true
      - path.repo=/usr/share/elasticsearch/backups
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_node1_data:/usr/share/elasticsearch/data
      - es_backups:/usr/share/elasticsearch/backups
      - ./elasticsearch/init:/usr/share/elasticsearch/init:ro
      - ./elasticsearch/scripts:/usr/share/elasticsearch/scripts:ro
    networks:
      - smarttech_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  es-node2:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: smarttech_es_node2
    restart: unless-stopped
    environment:
      - cluster.name=smarttech-cluster
      - node.name=es-node2
      - node.roles=master,data,ingest
      - discovery.seed_hosts=es-node1,es-node3
      - cluster.initial_master_nodes=es-node1,es-node2,es-node3
      - network.host=0.0.0.0
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - bootstrap.memory_lock=true
      - path.repo=/usr/share/elasticsearch/backups
    ports:
      - "9201:9200"
      - "9301:9300"
    volumes:
      - es_node2_data:/usr/share/elasticsearch/data
      - es_backups:/usr/share/elasticsearch/backups
      - ./elasticsearch/init:/usr/share/elasticsearch/init:ro
      - ./elasticsearch/scripts:/usr/share/elasticsearch/scripts:ro
    networks:
      - smarttech_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  es-node3:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: smarttech_es_node3
    restart: unless-stopped
    environment:
      - cluster.name=smarttech-cluster
      - node.name=es-node3
      - node.roles=master,data,ingest
      - discovery.seed_hosts=es-node1,es-node2
      - cluster.initial_master_nodes=es-node1,es-node2,es-node3
      - network.host=0.0.0.0
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - bootstrap.memory_lock=true
      - path.repo=/usr/share/elasticsearch/backups
    ports:
      - "9202:9200"
      - "9302:9300"
    volumes:
      - es_node3_data:/usr/share/elasticsearch/data
      - es_backups:/usr/share/elasticsearch/backups
      - ./elasticsearch/init:/usr/share/elasticsearch/init:ro
      - ./elasticsearch/scripts:/usr/share/elasticsearch/scripts:ro
    networks:
      - smarttech_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: smarttech_kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://es-node1:9200
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
    volumes:
      - kibana_data:/usr/share/kibana/data
    networks:
      - smarttech_network
    depends_on:
      es-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: smarttech_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis-stable.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_smarttech_2024}
      - REDIS_MAXMEMORY=${REDIS_MAXMEMORY:-512mb}
      - REDIS_MAXCLIENTS=${REDIS_MAXCLIENTS:-10000}
    networks:
      - smarttech_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_smarttech_2024}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: smarttech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_ecommerce_dev
      POSTGRES_USER: smart_dev
      POSTGRES_PASSWORD: smart_dev_password_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # ⚠️  CRITICAL: postgres_data contains ALL database data
      # This includes products, users, orders, categories, etc.
      # DO NOT remove this volume unless you have a verified backup
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d
    networks:
      - smarttech_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_dev -d smart_ecommerce_dev"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-latest}
    container_name: smarttech_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant/qdrant.yml:/qdrant/config/production.yaml:ro
    environment:
      - QDRANT__SERVICE__HTTP_PORT=${QDRANT_PORT:-6333}
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL:-INFO}
    networks:
      - smarttech_network
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 10 bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: smarttech_ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - smarttech_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smarttech_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smarttech.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_DEFAULT_SERVER_URL: 'http://postgres:5432'
      PGADMIN_MASTER_PASSWORD: pgadmin_master_2024
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./postgresql/pgadmin-servers.json:/pgadmin4/servers.json
    networks:
      - smarttech_network
    depends_on:
      - postgres

# ============================================
# Docker Volumes - CRITICAL DATA STORAGE
# ============================================
# These volumes contain ALL application data.
# Removing any of these volumes will result in PERMANENT DATA LOSS.
#
# Always create backups before modifying or removing volumes:
#   docker exec -i smarttech_postgres pg_dump -U smart_dev smart_ecommerce_dev > backup.sql
#
# Volume Contents:
#   postgres_data: All PostgreSQL database data (products, users, orders, etc.)
#   redis_data: All Redis cache and session data
#   es_node1_data, es_node2_data, es_node3_data: All Elasticsearch indices
#   es_backups: Elasticsearch snapshot backups
#   qdrant_data: All Qdrant vector embeddings
#   ollama_data: All Ollama AI models
# ============================================

volumes:
  postgres_data:
    driver: local
    # Labels for better volume management
    labels:
      - "com.smarttech.description=PostgreSQL database - contains all application data"
      - "com.smarttech.critical=true"
      - "com.smarttech.backup-required=true"
  pgadmin_data:
    driver: local
  redis_data:
    driver: local
  es_node1_data:
    driver: local
  es_node2_data:
    driver: local
  es_node3_data:
    driver: local
  es_backups:
    driver: local
  kibana_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_data:
    driver: local

networks:
  smarttech_network:
    driver: bridge